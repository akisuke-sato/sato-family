<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#079bd7"><title>Sato family</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#18334b;background:#e9f8ff}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.hero{background:linear-gradient(180deg,#0088dd 0%,#17b9e9 48%,#7de0e8 72%,#dff9f5 100%);padding:36px 18px 76px;text-align:center;position:relative;overflow:hidden;color:white}.hero:before{content:'☁️';position:absolute;top:20px;left:8%;font-size:42px;opacity:.75}.hero:after{content:'☁️';position:absolute;top:64px;right:7%;font-size:30px;opacity:.8}.eyebrow{letter-spacing:4px;font-size:11px;font-weight:700}.hero h1{font-size:clamp(24px,6vw,36px);margin:13px 0 10px;text-shadow:0 2px 12px #0074a944}.hero p{font-size:13px;margin:0}.shell{max-width:760px;margin:-53px auto 90px;padding:0 16px;position:relative}.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.cat{border:1px solid #ffffffaa;border-radius:17px;padding:18px 5px;color:white;min-height:100px;box-shadow:0 8px 24px #076caa22;background:linear-gradient(140deg,#0b87d7,#0dd1e0);text-align:center}.cat:nth-child(2){background:linear-gradient(135deg,#148acb,#35c5e3)}.cat:nth-child(3){background:linear-gradient(135deg,#277cc8,#7cb4e6)}.cat .emoji{font-size:25px;display:block;margin-bottom:8px}.cat strong{font-size:13px}.stats{background:#ffffffdf;backdrop-filter:blur(12px);border-radius:20px;display:flex;justify-content:space-around;margin:18px 0;padding:18px 5px;box-shadow:0 5px 24px #1378aa16}.stat{text-align:center;flex:1}.stat+ .stat{border-left:1px solid #d5e6ee}.stat b{font-size:27px;color:#087ebc;display:block}.stat span{font-size:11px;color:#617d8f}.toolbar{display:flex;gap:7px;overflow-x:auto;padding:4px 0 13px}.pill{border:0;border-radius:50px;padding:10px 14px;white-space:nowrap;background:#fff;color:#4c7087;font-size:12px;font-weight:700}.pill.active{background:#078fdb;color:white}.item{display:flex;align-items:center;gap:11px;background:#fff;border-radius:17px;padding:13px;margin-bottom:9px;box-shadow:0 4px 17px #167aaa10}.check{width:25px;height:25px;border:2px solid #a8c6d9;border-radius:50%;background:white;flex-shrink:0}.check.done{background:#099ce0;border-color:#099ce0;color:white}.item-main{flex:1;min-width:0}.item-title{font-weight:700;font-size:14px;overflow-wrap:anywhere}.item-title.done{text-decoration:line-through;color:#8799a3}.meta{font-size:11px;color:#6b90a3;margin-top:5px}.small-btn{border:0;background:#e8f6fc;color:#287da8;border-radius:9px;padding:7px 9px}.empty{text-align:center;padding:32px;color:#7193a4}.add{position:fixed;right:max(20px,calc((100vw - 760px)/2 + 24px));bottom:24px;border:0;border-radius:50%;width:62px;height:62px;background:linear-gradient(145deg,#08bce8,#007dd6);box-shadow:0 8px 28px #0084c655;color:white;font-size:34px}.modal-bg{position:fixed;inset:0;background:#123e5b88;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-bg.show{display:flex}.modal{background:white;border-radius:22px;padding:22px;width:min(100%,460px);max-height:90vh;overflow:auto}.modal h2{margin:0 0 15px;font-size:20px}.field{display:block;margin:12px 0;font-size:12px;font-weight:700}.field input,.field select,.field textarea{display:block;width:100%;margin-top:6px;border:1px solid #cbdfe9;border-radius:11px;padding:12px;background:#fbfdff;color:#173b50}.actions{display:flex;gap:8px;margin-top:17px}.primary{background:#078ed6;color:white;border:0;border-radius:11px;padding:12px 16px;font-weight:700;flex:1}.secondary{background:#e9f4fa;color:#23678a;border:0;border-radius:11px;padding:12px 16px}.top-actions{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}.top-actions button{border:0;background:#ffffffdd;border-radius:10px;padding:9px 12px;color:#2679a4;font-size:12px;font-weight:700}.note{font-size:11px;color:#64859a;margin:10px 4px}.link{color:#087ebc;word-break:break-all}.status{font-size:11px;text-align:center;color:#487a92;margin:12px}.danger{color:#c53d50}.hidden{display:none!important}
</style></head><body><header class="hero"><div class="eyebrow">🌺 OUR BUCKET LIST</div><h1>Sato family ♡</h1><p>あぴちゃん ＆ あさちゃん<br>思い出を、ひとつずつ増やそう。</p></header><main class="shell"><div class="top-actions"><button id="exportBtn">⬇ バックアップ</button><button id="importBtn">⬆ 復元</button><button id="syncBtn">⚙ ふたりで共有</button></div><div class="categories"><button class="cat" data-filter="food"><span class="emoji">🍽️</span><strong>食べたいもの</strong></button><button class="cat" data-filter="place"><span class="emoji">📍</span><strong>行きたい場所</strong></button><button class="cat" data-filter="todo"><span class="emoji">✨</span><strong>やりたい事</strong></button></div><section class="stats"><div class="stat"><b id="total">0</b><span>登録した夢</span></div><div class="stat"><b id="done">0</b><span>達成した夢</span></div><div class="stat"><b id="rate">0%</b><span>達成率</span></div></section><nav class="toolbar" id="filters"><button class="pill active" data-filter="all">すべて</button><button class="pill" data-filter="food">🍽️ 食べたい</button><button class="pill" data-filter="place">📍 行きたい</button><button class="pill" data-filter="todo">✨ やりたい</button><button class="pill" data-filter="completed">✓ 達成済み</button></nav><div id="items"></div><p class="status" id="status">この端末に自動保存しています</p><p class="note">※共有設定をしない場合は、この端末内に保存されます。大切なリストは定期的にバックアップしてください。</p></main><button class="add" id="addBtn" aria-label="新しく追加">＋</button>
<div class="modal-bg" id="editModal"><div class="modal"><h2 id="editHeading">やりたいことを追加</h2><form id="editForm"><label class="field">タイトル<input id="name" required maxlength="120" placeholder="例：美味しいすき焼きを食べる"></label><label class="field">カテゴリー<select id="category"><option value="food">🍽️ 食べたいもの</option><option value="place">📍 行きたい場所</option><option value="todo">✨ やりたい事</option></select></label><label class="field">追加した人<select id="owner"><option>あぴちゃん</option><option>あさちゃん</option></select></label><label class="field">メモ<textarea id="memo" rows="3" placeholder="予算、行きたい理由など"></textarea></label><label class="field">URL（お店・地図・参考ページ）<input id="url" type="url" placeholder="https://..."></label><div class="actions"><button class="secondary" type="button" id="cancelEdit">キャンセル</button><button class="primary" type="submit">保存する</button></div><button type="button" id="deleteBtn" class="secondary danger hidden" style="margin-top:12px;width:100%">この項目を削除</button></form></div></div>
<div class="modal-bg" id="syncModal"><div class="modal"><h2>☁️ Sato family にログイン</h2><p style="font-size:13px;line-height:1.7">Firebaseに登録したメールアドレスとパスワードでログインしてください。あさちゃんの登録はあとから追加できます。</p><label class="field">メールアドレス<input type="email" id="loginEmail" autocomplete="email"></label><label class="field">パスワード<input type="password" id="loginPassword" autocomplete="current-password"></label><div class="actions"><button class="secondary" id="cancelSync" type="button">閉じる</button><button class="primary" id="saveSync" type="button">ログインして同期</button></div><p class="status" id="syncMessage"></p><button class="secondary" id="logoutBtn" type="button" style="width:100%">ログアウト</button></div></div><input type="file" id="fileInput" accept="application/json" hidden>
<script type="module">
const $=id=>document.getElementById(id), KEY='miyako-bucket-v1';let data=JSON.parse(localStorage.getItem(KEY)||'null')||[{id:crypto.randomUUID(),name:'美味しいすき焼きを食べる',category:'food',owner:'あぴちゃん',memo:'',url:'',done:false,created:Date.now()}];let filter='all',editing=null,db=null,unsubscribe=null,room='family',firestoreApi=null,auth=null;
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const persist=()=>{localStorage.setItem(KEY,JSON.stringify(data));render()};
function render(){const completed=data.filter(x=>x.done).length;$('total').textContent=data.length;$('done').textContent=completed;$('rate').textContent=(data.length?Math.round(completed/data.length*100):0)+'%';document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));let shown=data.filter(x=>filter==='all'||(filter==='completed'?x.done:x.category===filter)).sort((a,b)=>Number(a.done)-Number(b.done)||(b.created||0)-(a.created||0));$('items').innerHTML=shown.length?shown.map(x=>`<article class="item"><button class="check ${x.done?'done':''}" data-check="${escape(x.id)}" aria-label="達成切り替え">${x.done?'✓':''}</button><div class="item-main"><div class="item-title ${x.done?'done':''}">${escape(x.name)}</div><div class="meta">${{food:'🍽️ 食べたいもの',place:'📍 行きたい場所',todo:'✨ やりたい事'}[x.category]||''} ・ ${escape(x.owner)}${x.done?' ・ 🎉 達成済み':''}</div>${x.memo?`<div class="meta">${escape(x.memo)}</div>`:''}${/^https:\/\//.test(x.url||'')?`<div class="meta"><a class="link" target="_blank" rel="noopener noreferrer" href="${escape(x.url)}">関連リンクを開く ↗</a></div>`:''}</div><button class="small-btn" data-edit="${escape(x.id)}">編集</button></article>`).join(''):'<div class="empty">まだ登録がありません。<br>＋から追加してみよう！ 🌊</div>'}
async function save(){persist();if(db&&firestoreApi&&room){try{await firestoreApi.setDoc(firestoreApi.doc(db,'bucketLists',room),{items:data,updated:Date.now()});$('status').textContent='☁️ ふたりのリストを同期しました'}catch(e){$('status').textContent='同期失敗：'+e.message}}}
function modal(id,open){$(id).classList.toggle('show',open)}function edit(id){editing=id;let x=data.find(a=>a.id===id);$('editHeading').textContent=x?'項目を編集':'やりたいことを追加';$('name').value=x?.name||'';$('category').value=x?.category||(['food','place','todo'].includes(filter)?filter:'food');$('owner').value=x?.owner||'あぴちゃん';$('memo').value=x?.memo||'';$('url').value=x?.url||'';$('deleteBtn').classList.toggle('hidden',!x);modal('editModal',true)}
$('addBtn').onclick=()=>edit(null);$('cancelEdit').onclick=()=>modal('editModal',false);document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});$('items').onclick=e=>{const a=e.target.closest('[data-check]'),b=e.target.closest('[data-edit]');if(a){let x=data.find(i=>i.id===a.dataset.check);if(x){x.done=!x.done;x.completedAt=x.done?new Date().toISOString():null;save()}}if(b)edit(b.dataset.edit)};
$('editForm').onsubmit=e=>{e.preventDefault();let x={name:$('name').value.trim(),category:$('category').value,owner:$('owner').value,memo:$('memo').value.trim(),url:$('url').value.trim()};if(!x.name)return;if(editing){data=data.map(a=>a.id===editing?{...a,...x}:a)}else data.push({id:crypto.randomUUID(),...x,done:false,created:Date.now()});modal('editModal',false);save()};$('deleteBtn').onclick=()=>{if(confirm('この項目を削除しますか？')){data=data.filter(x=>x.id!==editing);modal('editModal',false);save()}};
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,items:data},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ふたりのバケットリスト-バックアップ.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{try{let json=JSON.parse(await e.target.files[0].text());if(!Array.isArray(json.items))throw Error('形式が違います');if(confirm('現在のリストをバックアップの内容で置き換えますか？')){data=json.items.filter(x=>x&&typeof x.name==='string'&&['food','place','todo'].includes(x.category));await save()}}catch(err){alert('読み込めませんでした：'+err.message)}e.target.value=''};
const firebaseConfig={apiKey:"AIzaSyCKNJKPjT7zAfOsUPlUANXwXqt_pqI541Y",authDomain:"sato-family-b52a3.firebaseapp.com",projectId:"sato-family-b52a3",storageBucket:"sato-family-b52a3.firebasestorage.app",messagingSenderId:"232279898069",appId:"1:232279898069:web:43d8802fdfc411c24c6f5c"};
const {initializeApp}=await import('https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js');
const {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}=await import('https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js');
const {getFirestore,doc,onSnapshot,setDoc}=await import('https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js');
const app=initializeApp(firebaseConfig);auth=getAuth(app);const store=getFirestore(app);const ref=doc(store,'bucketLists','family');firestoreApi={doc,setDoc};
$('syncBtn').onclick=()=>modal('syncModal',true);
$('cancelSync').onclick=()=>modal('syncModal',false);
$('saveSync').onclick=async()=>{try{$('syncMessage').textContent='ログイン中…';await signInWithEmailAndPassword(auth,$('loginEmail').value.trim(),$('loginPassword').value);$('loginPassword').value='';modal('syncModal',false)}catch(e){$('syncMessage').textContent='ログイン失敗：'+e.code}};
$('logoutBtn').onclick=async()=>{await signOut(auth);modal('syncModal',false)};
onAuthStateChanged(auth,user=>{if(unsubscribe){unsubscribe();unsubscribe=null}db=null;if(!user){$('status').textContent='未ログイン（端末内に保存中）';$('syncBtn').textContent='🔐 ログイン';return}db=store;$('syncBtn').textContent='☁️ ログイン中';$('status').textContent='☁️ データを読み込み中…';let first=true;unsubscribe=onSnapshot(ref,async snap=>{if(snap.exists()){data=Array.isArray(snap.data().items)?snap.data().items:[];persist()}else if(first){try{await setDoc(ref,{items:data,updated:Date.now()})}catch(e){$('status').textContent='保存不可：Firestoreルールを確認してね'}}first=false;if(snap.exists())$('status').textContent='☁️ Sato family 同期中'},e=>{$('status').textContent='同期エラー：Firestoreのアクセス権限を確認してね'})});
render();
